name: ci

# Builds launcher, runs its AUnit suite and release check, and renders it
# (--smoke, Mesa's lavapipe software Vulkan) on Linux, macOS and Windows.
#
# It was Linux-only, and that hid the fact that the binaries asked for "-lvulkan" on
# every platform while the Vulkan loader on Windows is vulkan-1.dll -- launcher could
# not have been built there at all, and nothing said so.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 macOS job, on the pinned toolchain; it is
        # the last x86_64 image Actions will offer.
        #
        # macos-latest is Apple silicon. gnat_native=15.2.1 ships no
        # aarch64-darwin binary, so -- as files does -- that one job builds with
        # 15.3.1, the nearest release that has one, and rewrites the =15.2.1
        # pins in its own checkout to match. Every other job, and every
        # manifest in the repositories, stays on 15.2.1.
        os: [ubuntu-latest, macos-15-intel, windows-latest, macos-latest]
        include:
          - toolchain: gnat_native=15.2.1
          - os: macos-latest
            toolchain: gnat_native=15.3.1
    steps:
      - name: Check out launcher
        uses: actions/checkout@v7
        with:
          path: launcher

      # launcher pins guikit, textrender, hostkit, messages and i18n as path
      # dependencies (guikit in turn pins textrender, messages pins i18n), and
      # building i18n runs its pre-build regeneration -- download_tzdb
      # (httpclient with ssllib/truststores, zlib on cryptolib, tarlib,
      # awklib-on-regexp) and the CLDR import (project_tools) -- so all of
      # those siblings are cloned next to the checkout. Each is cloned at a
      # reviewed commit, as files' CI does, so a launcher revision always
      # builds against the same dependency set instead of whatever each
      # sibling's main is that day. BUMP THESE PINS when launcher needs a
      # sibling change (the commit must be pushed before CI can fetch it), and
      # add a sibling here when one gains a new path pin.
      - name: Clone sibling crates at pinned revisions
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          clone_at() {
            name="$1"
            revision="$2"
            git init "$name"
            git -C "$name" remote add origin "https://github.com/${owner}/${name}.git"
            # A fetch dying halfway is the runner's network; try it three times.
            for attempt in 1 2 3; do
              if git -C "$name" fetch --depth 1 origin "$revision"; then
                git -C "$name" checkout --detach FETCH_HEAD
                return 0
              fi
              echo "::warning::fetching ${name} at ${revision} failed (attempt ${attempt})"
              sleep 5
            done
            echo "::error::could not fetch ${owner}/${name} at ${revision}"
            return 1
          }
          clone_at project_tools 5ed5f4dcfa10301345933d45e5f78ac0573d8cff
          clone_at i18n 21d4d191f1d90a16248b71dfc54b4384502cf658
          clone_at messages 1a3434a6796e1017cd10ede2a8a338c9cfdb0e5c
          clone_at textrender 0a6721cb4239e581518c0d312bb7085e5b1ff402
          clone_at guikit c42c04fd83e5d22c02f950354e0da6b0862623cc
          clone_at hostkit 2301cbdee2b3c9f41168b34be098a6832f0bdeb4
          clone_at zlib e2a66961dc1ebb9d90433160a43f78f52f8db9e1
          clone_at cryptolib 2e5c415f65fd49c2a496c97813740fa9b83e02fa
          clone_at regexp f660333a314f3c610bb255478ac86656e2fd0c4c
          clone_at httpclient 4a6847ee9ba01888d945bb77274cbf5bb536cd13
          clone_at ssllib b1637fa14a30ab60b7ef6800533a88aed5a549bf
          clone_at truststores 90ce36a625ce8687685e0bf98ce279ee0f39c697
          clone_at tarlib 1a6f22ae04e89a2e634d00f283527d337e3d3b1b
          clone_at awklib 648bd7466e3b36112027c2116326b146224b2e21

      # What project_tools' checkout-ada-siblings action did besides cloning
      # each sibling's main, inlined as files inlines it: building i18n
      # regenerates its data, which on a fresh checkout downloads cldr-json,
      # the IANA tzdb and the Unicode data -- sources Windows runners reach
      # only intermittently. The raw download trees are cached under a key
      # that is the same on every OS, so a Linux or macOS download seeds the
      # Windows job; the key changes with any version or downloader change.
      - name: Compute an OS-stable i18n upstream cache key
        id: cldr_key
        if: hashFiles('i18n/cldr/upstream/source_manifest.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          h=$(cat \
                "$GITHUB_WORKSPACE/i18n/cldr/upstream/source_manifest.txt" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_cldr_upstream.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_tzdb.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/fetch_ucd.adb" \
              | tr -d '\r' | git hash-object --stdin)
          echo "key=i18n-upstream-$h" >> "$GITHUB_OUTPUT"
      - name: Cache the i18n upstream download trees
        if: steps.cldr_key.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            i18n/cldr/upstream/cldr-json
            i18n/cldr/upstream/tzdb
            i18n/cldr/upstream/ucd
            i18n/cldr/upstream/ucd16
            i18n/cldr/upstream/uca
            i18n/cldr/upstream/collation
            i18n/cldr/upstream/transforms
            i18n/cldr/upstream/transforms_test
          key: ${{ steps.cldr_key.outputs.key }}
          enableCrossOsArchive: true

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # openglada_glfw's Linker_Options require the X11 libraries below; without
          # them everything compiles and the link then fails on -lXxf86vm.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            mesa-vulkan-drivers \
            xvfb \
            fonts-dejavu-core \
            libxcursor-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev
          # OpenSSL for httpclient's TLS bridge (i18n's download_tzdb links it).
          sudo apt-get install -y libssl-dev
          sudo apt-get install -y libaunit-dev \
            || sudo apt-get install -y libaunit22-dev \
            || sudo apt-get install -y libaunit24-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use the runner image's coherent Homebrew snapshot, as files does. A
          # brew update moved gdk-pixbuf onto openssl@4, which has no Intel bottle,
          # and building it from source ran past the job timeout.
          export HOMEBREW_NO_AUTO_UPDATE=1
          # The Intel image can keep a dangling openssl@1.1 link that makes an
          # otherwise successful openssl upgrade report failure.
          brew unlink openssl@1.1 || true
          if [ -L /usr/local/bin/openssl ] &&
             [[ "$(readlink /usr/local/bin/openssl)" == *openssl@1.1* ]]; then
            unlink /usr/local/bin/openssl
          fi
          # MoltenVK provides the Vulkan loader/ICD on macOS; gdk-pixbuf pulls in
          # glib, which the test binary's linker switches name.
          # openssl@3: httpclient's TLS bridge (i18n's download_tzdb links it).
          brew install vulkan-headers vulkan-loader molten-vk glfw gdk-pixbuf openssl@3

          # Homebrew on the x86_64 runner installs under /usr/local, which is not on
          # the linker's default search path; openssl@3 is keg-only, so add its lib
          # dir too.
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its `ld` needs mingw
          # import libraries (libvulkan-1.dll.a). The chocolatey vulkan-sdk ships MSVC
          # .lib files, which that linker cannot use -- take every library from the
          # MSYS2 installation preinstalled on the runner instead.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }

          # The runner's MSYS2 keyring goes stale, and then the database refuses to
          # sync at all: "signature ... is invalid". Refresh it first, and fall back
          # to an unsigned sync if the signed one still will not go -- this is a
          # throwaway CI image installing four well-known libraries, not a machine
          # whose supply chain we are defending.
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          # openssl: httpclient's TLS bridge (i18n's download_tzdb links it).
          packages="mingw-w64-x86_64-vulkan-loader
                    mingw-w64-x86_64-glib2
                    mingw-w64-x86_64-gdk-pixbuf2
                    mingw-w64-x86_64-glfw
                    mingw-w64-x86_64-openssl"

          # The mirrors stall often enough to matter -- a sync dies on "less than 1
          # bytes/sec" rather than on anything we did -- so give each sync room to be
          # slow, and retry it before concluding anything is actually wrong.
          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          if [ -z "$synced" ]; then
            echo "::warning::signed pacman sync failed; retrying without signature checks"
            # This step runs in Git Bash, whose /tmp is NOT the /tmp of the MSYS2
            # installation that owns this pacman -- writing the config to "/tmp" puts
            # it somewhere pacman would never look. Hand both a path they agree on.
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2 3; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"
              sleep 15
            done
          fi

          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }

          # ld resolves -l<name> through LIBRARY_PATH; the DLLs must also be on PATH
          # for the test binary to start.
          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Set up Alire
        # Pin the toolchain the manifests require. setup-alire@v5 defaults to alr
        # 2.1.0, whose index carries gnat_native 15.2.1; v4 pins alr 2.0.2, whose
        # older index cannot resolve it.
        uses: alire-project/setup-alire@v6
        with:
          toolchain: ${{ matrix.toolchain }} gprbuild

      - name: Pin the Apple silicon toolchain in this checkout (macos-latest)
        # See the matrix: no 15.2.1 exists for aarch64-darwin. Every crate in
        # the closure pins gnat_native =15.2.1, so the solve would fail on the
        # toolchain this job can have; this job's copies pin 15.3.1 instead.
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          find . -name alire.toml -not -path "*/alire/*" -print0 |
            xargs -0 grep -l 'gnat_native = "=15.2.1"' |
            while read -r manifest; do
              sed -i '' 's/gnat_native = "=15.2.1"/gnat_native = "=15.3.1"/' "$manifest"
              echo "pinned 15.3.1 in $manifest"
            done
          # GCC otherwise links against the Command Line Tools SDK, whose
          # library stubs name architectures (arm64e.x1) the selected Xcode's
          # ld does not know, and every link fails. The SDK of that Xcode
          # matches its ld.
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the application
        shell: bash
        working-directory: launcher
        run: alr --non-interactive build

      - name: Build and run the test suite
        shell: bash
        working-directory: launcher/tests
        run: |
          alr --non-interactive build
          # The binary is launcher_tests.exe on Windows, and bash will not find it
          # under the Unix name.
          if [ -f ./bin/launcher_tests.exe ]; then
            # A missing DLL makes Windows refuse to start the process, and bash
            # reports that as a plain "not found" (exit 127), with no hint as to
            # which library is absent. Name any unresolved import.
            export PATH="/c/msys64/mingw64/bin:$PATH"
            if ldd ./bin/launcher_tests.exe | grep -i 'not found'; then
              echo "::error::the test binary has unresolved DLL imports (listed above)"
              exit 1
            fi
            ./bin/launcher_tests.exe
          else
            ./bin/launcher_tests
          fi
      # The release check reads the tree relative to tests/ (../README.md,
      # ../share/launcher.catalog, the i18n data the root build bundled into
      # ../share/i18n, tests/src/...), so it runs from there, after the build.
      - name: Run the release check
        shell: bash
        working-directory: launcher/tests
        run: |
          if [ -f ./bin/launcher_release_check.exe ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            ./bin/launcher_release_check.exe
          else
            ./bin/launcher_release_check
          fi

      # The render gate, as files runs its live smoke: the whole GLFW + Vulkan
      # path under Xvfb with Mesa's lavapipe software Vulkan, and the frame
      # read back and checked for the search box, the rows, the icon gutter and
      # the scrollbar. The applications are a fixture -- forty entries, each with
      # a PNG icon -- so the icons and the overflow it checks for are there
      # whatever the runner image has installed. "launcher smoke: PASS" must be
      # printed: a launcher that finds no font returns before rendering.
      - name: Live render smoke (Linux, software Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        working-directory: launcher
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          data="$RUNNER_TEMP/launcher-smoke-data"
          mkdir -p "$data/applications"
          python3 - "$data/icon.png" <<'PY'
          import struct, sys, zlib
          w = h = 48
          raw = b"".join(b"\x00" + bytes([200, 60, 60, 255]) * w for _ in range(h))
          def chunk(kind, data):
              return (struct.pack(">I", len(data)) + kind + data
                      + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b""))
          open(sys.argv[1], "wb").write(png)
          PY
          for i in $(seq -w 1 40); do
            printf '[Desktop Entry]\nType=Application\nName=Smoke App %s\nExec=true\nIcon=%s\n' \
              "$i" "$data/icon.png" > "$data/applications/smoke-$i.desktop"
          done
          export XDG_DATA_HOME="$data"
          export XDG_STATE_HOME="$RUNNER_TEMP/launcher-smoke-state"
          set +e
          out="$(xvfb-run -a ./bin/launcher --smoke 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::launcher --smoke exited with $code"
            exit "$code"
          fi
          if ! printf '%s\n' "$out" | tr -d '\r' | grep -qx "launcher smoke: PASS"; then
            echo "::error::launcher --smoke did not report PASS"
            exit 1
          fi
          # The fixture gives every application an icon, so the icon check must
          # have been made, not passed for want of an icon to draw.
          if ! printf '%s\n' "$out" | tr -d '\r' | grep -q "have_icon=TRUE"; then
            echo "::error::launcher --smoke found no application icon in the fixture; the icon check passed vacuously"
            exit 1
          fi

      # The same gate on the other hosts, with lavapipe set up exactly as files
      # sets it up: from MSYS2 on Windows (registered in HKLM too, because the
      # runner's elevated shell has a loader that ignores VK_ICD_FILENAMES),
      # from Homebrew on macOS (the Intel runner has no Metal device, so
      # MoltenVK is only the fallback). The applications there are the host's
      # own -- Start Menu shortcuts, .app bundles -- from which launcher reads no
      # icon, and the smoke asks for icon ink only when some application has
      # one; it prints have_icon, and the step says when the check was not made.
      - name: Live render smoke (Windows and macOS, software Vulkan)
        if: runner.os != 'Linux'
        timeout-minutes: 30
        shell: bash
        working-directory: launcher
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set +e +o pipefail
          export VK_LOADER_DEBUG=error,warn
          export XDG_STATE_HOME="$RUNNER_TEMP/launcher-smoke-state"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            /c/msys64/usr/bin/pacman -S --noconfirm --needed --disable-download-timeout \
              mingw-w64-x86_64-mesa \
              || echo "::warning::could not install MSYS2 mesa"
            icd="$(ls /c/msys64/mingw64/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$(cygpath -w "$icd")"
              reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' //v "$(cygpath -w "$icd")" //t REG_DWORD //d 0 //f \
                || echo "::warning::could not register the lavapipe driver"
            fi
            bin=./bin/launcher.exe
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install mesa || echo "::warning::could not install Homebrew mesa"
            icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)"
            [ -n "$icd" ] || icd="$(ls "$(brew --prefix)"/{share,etc}/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -1)"
            if [ -n "$icd" ]; then
              export VK_ICD_FILENAMES="$icd"
            fi
            bin=./bin/launcher
            export MVK_CONFIG_LOG_LEVEL=2
          fi
          echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-<unset>}"
          out="$("$bin" --smoke 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::launcher --smoke exited with $code on $MATRIX_OS"
            exit "$code"
          fi
          if ! printf '%s\n' "$out" | tr -d '\r' | grep -qx "launcher smoke: PASS"; then
            echo "::error::launcher --smoke did not report PASS on $MATRIX_OS"
            exit 1
          fi
          # launcher reads no icon from a Start Menu shortcut or an .app bundle,
          # so there is no fixture here that could give one, and the icon check
          # is not made on this host. Say so rather than let a PASS imply it.
          if printf '%s\n' "$out" | tr -d '\r' | grep -q "have_icon=FALSE"; then
            echo "::notice::launcher smoke on $MATRIX_OS: no application has an icon, so icons were not checked"
          fi

      # A catalogue can be well-formed and still have drifted from the
      # messages it translates: a key with no original, an argument dropped so
      # the text renders without the value it was about, an option name
      # translated into a word the program rejects. The rule lives with the
      # catalogue format, in the messages crate.
      - name: Check the message catalogue
        # Linux-only, with an explicit shell: a catalogue is data, so the answer
        # cannot differ by host, and PowerShell -- the Windows runner's default
        # shell -- reads the leading "--" of an option as its own decrement
        # operator and refuses to parse the line.
        if: runner.os == 'Linux'
        shell: bash
        working-directory: messages/tools/catalog_check
        run: |
          alr --non-interactive build
          ./bin/catalog_check ../../../launcher/share/launcher.catalog \
            --verbatim=launcher

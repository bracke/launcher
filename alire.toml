name = "launcher"
description = "Keyboard-driven application launcher built on guikit"
version = "0.1.0-dev"
website = "https://github.com/bracke/launcher"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
tags = ["launcher", "gui"]

executables = ["launcher"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
guikit = "*"

[[depends-on]]
hostkit = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
i18n = "*"

[[pins]]
hostkit = { path = "../hostkit" }
guikit = { path = "../guikit" }
messages = { path = "../messages" }
i18n = { path = "../i18n" }

[[depends-on]]
textrender = "*"

[[pins]]
textrender = { path = "../textrender" }

[[depends-on]]
df_vulkan = "~0.1.0"

[[depends-on]]
openglada_glfw = "~0.9.0"

[[depends-on]]
utilada = "^2.9.0"

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). guikit is shared by files and launcher, and the profile lives in
# its generated config gpr: if one root built it at -O3 and the other at -Og, each
# switch would silently force a full guikit rebuild. Keeping every root on the same
# profile lets them share object files.
# Bundle i18n's generated locale data into share/i18n after every build. launcher
# renders its catalog through the messages crate, which serves formatting from
# those files at runtime, so a deployed bin/launcher must ship them (found at
# Exe/../share/i18n). bundle_i18n_data is a standalone Ada tool (tools/i18n_bundle)
# kept out of the app's own bin so it is never installed; build it, then run it.
# Both steps are plain executables -- no shell.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

[build-profiles]
"*" = "development"
